# 日常只构建一次 ARM64 镜像，检查通过后发布同一份产物。
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - '.dockerignore'
      - 'VERSION'
      - 'package*.json'
      - 'src/**'
      - 'scripts/**'
      - 'web/**'
      - 'worker/**'
      - 'api-kernel/**'
      - 'native-slot/cmd/**'
      - 'native-slot/internal/**'
      - 'native-slot/go.*'
      - 'deploy/**'
      - 'docker/kin-os/**'
      - 'share/**'
      - 'docker-compose*.yml'
      - 'test/deploy/**'
      - 'test/unit/wrap-cli-runtime.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.dockerignore'
      - 'VERSION'
      - 'package*.json'
      - 'src/**'
      - 'scripts/**'
      - 'web/**'
      - 'worker/**'
      - 'api-kernel/**'
      - 'native-slot/cmd/**'
      - 'native-slot/internal/**'
      - 'native-slot/go.*'
      - 'deploy/**'
      - 'docker/kin-os/**'
      - 'share/**'
      - 'docker-compose*.yml'
      - 'test/deploy/**'
      - 'test/unit/wrap-cli-runtime.test.mjs'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: 解析版本与发布目标
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          ref=edge
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
              exit 1
            }
            ref="$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && { [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF_TYPE" = tag ]; }; then
            publish=true
          fi
          echo "image=ghcr.io/$owner/vm2api" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: ARM64 部署脚本回归
        run: python3 -m unittest discover -s test/deploy -v
      - name: 准备并检查固定版本 QEMU
        run: |
          python3 deploy/prepare-arm64.py
          python3 deploy/prepare-arm64.py --check
          python3 test/deploy/smoke_binfmt_restore.py
      - name: 验证 ARM64 Compose 配置
        run: |
          python3 deploy/init-arm64-env.py --port 18787 --container-name vm2api-arm64-ci
          docker compose -f docker-compose.yml -f docker-compose.arm64.yml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: 缓存构建 ARM64 控制面
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.arm64-control
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: vm2api-arm64-control:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=vm2api-arm64
          cache-to: type=gha,scope=vm2api-arm64,mode=max,ignore-error=true,timeout=2m
      - name: 验证原生运行时、内核和面板
        run: |
          docker run --rm --network none --platform linux/arm64 --entrypoint node \
            --mount "type=bind,src=$PWD/test,dst=/opt/vm2api/test,readonly" \
            vm2api-arm64-control:ci --test --test-name-pattern=crag test/unit/wrap-cli-runtime.test.mjs
          python3 test/deploy/smoke_arm64_image.py vm2api-arm64-control:ci
      - uses: docker/login-action@v4
        if: steps.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push image
        if: steps.meta.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_REF: ${{ steps.meta.outputs.ref }}
        run: |
          set -euo pipefail
          docker tag vm2api-arm64-control:ci "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker push "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker tag vm2api-arm64-control:ci "$IMAGE:$IMAGE_REF-arm64"
          docker push "$IMAGE:$IMAGE_REF-arm64"
          {
            echo "### ARM64 发布完成"
            echo "- 镜像：\`$IMAGE:$IMAGE_REF-arm64\`"
            echo "- 源码：\`$GITHUB_SHA\`"
            echo "- 已验证：原生 ARM64 wrap/crag 内核及 CLI、QEMU payload、入口文件刷新、health、console"
            docker image inspect "$IMAGE:$IMAGE_REF-arm64" --format '{{json .RepoDigests}}'
          } >> "$GITHUB_STEP_SUMMARY"
